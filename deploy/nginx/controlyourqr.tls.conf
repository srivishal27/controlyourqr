# ControlYourQR — HTTPS.
#
# Installed by deploy/scripts/enable-tls.sh once a certificate exists, and
# re-selected automatically by bootstrap.sh on subsequent runs. Certificates
# are obtained with `certbot certonly --webroot`, so certbot never edits this
# file and a redeploy cannot clobber the TLS configuration.

limit_req_zone  $binary_remote_addr zone=cyqr_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cyqr_conn:10m;

# --- port 80: challenge responder + redirect ----------------------------- #
server {
    listen      80 default_server;
    listen [::]:80 default_server;

    server_name controlyourqr.com www.controlyourqr.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the site --------------------------------------------------- #
server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name controlyourqr.com www.controlyourqr.com;

    ssl_certificate     /etc/letsencrypt/live/controlyourqr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/controlyourqr.com/privkey.pem;

    # Modern TLS only. TLS 1.0/1.1 and the RSA key-exchange suites are gone.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:CYQR:10m;
    ssl_session_tickets       off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/controlyourqr.com/chain.pem;
    resolver 169.254.169.254 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/snippets/controlyourqr.common.conf;
}
