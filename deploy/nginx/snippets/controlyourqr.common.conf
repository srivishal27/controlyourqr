# Shared location blocks for ControlYourQR.
#
# Included by both the pre-TLS (port 80) and TLS (port 443) site files so the
# routing is defined exactly once. Included from a `server` context.

root /opt/controlyourqr/app;

server_tokens off;

# Restore the caller's address when Cloudflare is proxying, so rate limiting
# keys on real clients rather than on a handful of edge IPs. Harmless when the
# proxy is off: no traffic then arrives from those ranges.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# No user content is ever posted; keep bodies tiny.
client_max_body_size  16k;
client_body_timeout   10s;
client_header_timeout 10s;

limit_req  zone=cyqr_req burst=40 nodelay;
limit_conn cyqr_conn 24;

gzip            on;
gzip_vary       on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied    any;
gzip_types      text/plain text/css text/xml application/javascript
                application/json image/svg+xml application/xml;

# --- static assets ------------------------------------------------------- #
# URLs are content-fingerprinted (?v=<hash>), so they can be cached hard.
location /static/ {
    alias /opt/controlyourqr/app/static/;
    access_log off;
    # Single source of truth for freshness; `expires` would add a second,
    # conflicting Cache-Control header alongside this one.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

location = /favicon.ico {
    alias /opt/controlyourqr/app/static/img/favicon.svg;
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
}

location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
}

# --- application --------------------------------------------------------- #
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    20s;
    proxy_read_timeout    20s;

    # The application sets its own security headers; don't leak gunicorn's.
    proxy_hide_header Server;
}

# Nothing here accepts anything but a read.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}
