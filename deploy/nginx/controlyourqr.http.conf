# ControlYourQR — plain HTTP only.
#
# The state a host is in before a certificate exists. bootstrap.sh installs
# this variant when /etc/letsencrypt has no certificate for the domain; run
# deploy/scripts/enable-tls.sh to obtain one and switch to the TLS variant.

limit_req_zone  $binary_remote_addr zone=cyqr_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cyqr_conn:10m;

server {
    listen      80 default_server;
    listen [::]:80 default_server;

    server_name controlyourqr.com www.controlyourqr.com;

    # ACME HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    include /etc/nginx/snippets/controlyourqr.common.conf;
}
